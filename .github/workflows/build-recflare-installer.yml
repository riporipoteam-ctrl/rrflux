# Builds the zero-touch RecFlare-pipeline Flux Rec installer (game/installer)
# on Windows and publishes it as a prerelease asset. The ns host and Photon
# App IDs are baked in at compile time from repository secrets, so they never
# appear in the repo.

name: Build RecFlare installer
# v0.2.11 trigger
# v0.2.10 trigger

on:
  push:
    branches: [main]
    paths:
      - "game/installer/**"
      - ".github/workflows/build-recflare-installer.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        working-directory: game/installer
        env:
          FLUXREC_NS_HOST: ${{ secrets.FLUXREC_NS_HOST }}
          FLUXREC_PHOTON_RT: ${{ secrets.FLUXREC_PHOTON_RT }}
          FLUXREC_PHOTON_VOICE: ${{ secrets.FLUXREC_PHOTON_VOICE }}
          FLUXREC_PHOTON_CHAT: ${{ secrets.FLUXREC_PHOTON_CHAT }}
        run: cargo build --release

      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ver = (Select-String -Path game\installer\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $tag = "recflare-installer-v$ver"
          # NOTE: do NOT pipe gh to Out-Null here — a pipeline leaves $LASTEXITCODE
          # stale (it reflects only the last *native* command), which silently
          # skipped release creation in v0.1.4.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Flux Rec setup (RecFlare pipeline) v$ver" --notes "Zero-touch installer: downloads the 2023 Rec Room client, installs the Steam bypass, BepInEx and the RecNet redirect plugin (RecFlare backend), writes config, no Steam needed. Transactional install with rollback."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $tag "game\installer\target\release\FluxRec-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          # SHA-256 checksum for the setup EXE (used by future updater verification).
          $hash = (Get-FileHash "game\installer\target\release\FluxRec-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "FluxRec-Setup.exe $hash" | Out-File "game\installer\target\release\SHA256SUMS.txt" -Encoding ascii
          gh release upload $tag "game\installer\target\release\SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload (checksums) failed" }

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FluxRec-Setup-RecFlare
          path: game/installer/target/release/FluxRec-Setup.exe
