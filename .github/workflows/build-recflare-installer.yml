# Builds the Ripo Team branded Flux Rec installer (game/installer)
# on Windows and publishes it as a prerelease asset. The ns host and Photon
# App IDs are baked in at compile time from repository secrets, so they never
# appear in the repo.

name: Build Ripo Team Launcher
# v0.2.20 trigger
# v0.2.19 trigger
# v0.2.18 trigger
# v0.2.17 trigger
# v0.2.16 trigger
# v0.2.15 trigger
# v0.2.14 trigger
# v0.2.13 trigger
# v0.2.12 trigger
# v0.2.11 trigger
# v0.2.10 trigger

on:
  push:
    branches: [main]
    paths:
      - "game/installer/**"
      - "game/patch-2025/**"
      - "game/patch-2026/**"
      - ".github/workflows/build-recflare-installer.yml"
  pull_request:
    paths:
      - "game/installer/**"
      - "game/patch-2025/**"
      - "game/patch-2026/**"
      - ".github/workflows/build-recflare-installer.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build 2025 client patch
        working-directory: game/patch-2025
        shell: pwsh
        run: |
          .\build.ps1 -Verbosity minimal
          $patch = Join-Path $PWD 'x64\Release\2025Patch.dll'
          if (-not (Test-Path -LiteralPath $patch)) { throw "Native patch output missing: $patch" }
          Copy-Item -LiteralPath $patch -Destination '..\installer\assets\2025Patch.dll' -Force
          Write-Host "Embedded 2025Patch.dll: $((Get-Item $patch).Length) bytes"

      # Keep the embedded 2026 patch in sync with its native source.
      - name: Build 2026 client patch
        working-directory: game/patch-2026
        shell: pwsh
        run: |
          .\build.ps1
          Copy-Item -LiteralPath 'x64\Release\2026patch.dll' -Destination '..\installer\assets\2026patch.dll' -Force
          Copy-Item -LiteralPath 'x64\Release\Injector.exe' -Destination '..\installer\assets\2026-Injector.exe' -Force

      - name: Build installer
        working-directory: game/installer
        env:
          FLUXREC_NS_HOST: ${{ secrets.FLUXREC_NS_HOST }}
          FLUXREC_PHOTON_RT: ${{ secrets.FLUXREC_PHOTON_RT }}
          FLUXREC_PHOTON_VOICE: ${{ secrets.FLUXREC_PHOTON_VOICE }}
          FLUXREC_PHOTON_CHAT: ${{ secrets.FLUXREC_PHOTON_CHAT }}
        run: cargo build --release

      - name: Publish prerelease
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ver = (Select-String -Path game\installer\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $tag = "ripo-team-launcher-v$ver"
          # NOTE: do NOT pipe gh to Out-Null here — a pipeline leaves $LASTEXITCODE
          # stale (it reflects only the last *native* command), which silently
          # skipped release creation in v0.1.4.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Ripo Team Launcher - Flux Rec v$ver" --notes "Ripo Team Launcher setup for Flux Rec, with redesigned setup, library, and automatic update screens."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $tag "game\installer\target\release\FluxRec-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          # SHA-256 checksum for the setup EXE (used by future updater verification).
          $hash = (Get-FileHash "game\installer\target\release\FluxRec-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "FluxRec-Setup.exe $hash" | Out-File "game\installer\target\release\SHA256SUMS.txt" -Encoding ascii
          gh release upload $tag "game\installer\target\release\SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload (checksums) failed" }

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ripo-Team-Launcher-Setup
          path: |
            game/installer/target/release/FluxRec-Setup.exe
            game/patch-2026/x64/Release/2026patch.dll
            game/patch-2026/x64/Release/Injector.exe



