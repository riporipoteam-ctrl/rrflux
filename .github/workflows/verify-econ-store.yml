name: Verify 2025 store preview regressions

on:
  pull_request:
    paths:
      - '.github/workflows/verify-econ-store.yml'
      - 'server/apps/econ/src/econ.app.ts'
      - 'server/apps/econ/src/test/integration/api.test.ts'
      - 'server/apps/econ/static/consumables.json'
      - 'server/apps/econ/static/storefronts/sf2.json'
      - 'server/apps/econ/static/storefronts/sf3-2025.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-econ-store.yml'
      - 'server/apps/econ/src/econ.app.ts'
      - 'server/apps/econ/src/test/integration/api.test.ts'
      - 'server/apps/econ/static/consumables.json'
      - 'server/apps/econ/static/storefronts/sf2.json'
      - 'server/apps/econ/static/storefronts/sf3-2025.json'

jobs:
  test:
    name: 2025 store preview integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: server
        run: pnpm install --no-frozen-lockfile

      - name: Run focused store and consumable preview tests
        working-directory: server/apps/econ
        run: pnpm run test -- src/test/integration/api.test.ts --testNamePattern='GET /api/consumables/v2/getUnlocked includes the matching 2025 model configuration|storefront 3 defaults anonymous browsing to sf3-2025 and retains build-aware legacy behavior|sf3-2025 is the authentic 2025 Watch-store capture'

      - name: Typecheck econ worker
        working-directory: server/apps/econ
        run: pnpm run check:types
