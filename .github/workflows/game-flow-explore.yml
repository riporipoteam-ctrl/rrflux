      - name: Sixth click at client-relative coordinate
        if: ${{ inputs.click6_x != '0' }}
        shell: pwsh
        run: |
          Start-Sleep -Seconds ([int]"10")
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
            using System; using System.Runtime.InteropServices;
            public class W32c6 {
              [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, uint d, UIntPtr e);
              [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
            }
          "@
          $p = Get-Process RecRoom -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($p -and $p.MainWindowHandle -ne 0) {
            [W32c6]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 2
            $pt = New-Object W32c6+POINT
            $pt.X = [int]"${{ inputs.click6_x }}"; $pt.Y = [int]"${{ inputs.click6_y }}"
            [W32c6]::ClientToScreen($p.MainWindowHandle, [ref]$pt) | Out-Null
            Write-Host "sixth click at screen ($($pt.X),$($pt.Y))"
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($pt.X, $pt.Y)
            Start-Sleep -Milliseconds 500
            [W32c6]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 150
            [W32c6]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
            Write-Host "sixth click done"
          } else { Write-Host "game window not found, no sixth click" }
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(1280, 720)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen([System.Drawing.Point]::new(0,0), [System.Drawing.Point]::Empty, [System.Drawing.Size]::new(1280,720))
          $bmp.Save("D:\shots\shot_mid6.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Write-Host "saved shot_mid6.png"

