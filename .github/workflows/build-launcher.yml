# Builds the Flux Rec setup.exe on every push to main that touches
# launcher/. The Windows NSIS installer is uploaded as a build artifact —
# players download it and run it; no other steps needed on their side.

name: Build launcher

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: launcher
        run: npm install

      - name: Build setup.exe
        uses: tauri-apps/tauri-action@v0
        env:
          # Baked into the launcher at compile time for Firebase Auth
          # sign-in (public web API key, not a secret). Set as a repo secret.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        with:
          projectPath: launcher

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FluxRec-setup
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
