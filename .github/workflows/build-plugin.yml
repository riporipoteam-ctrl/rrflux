name: Build plugin DLL on Windows

# Builds RecNetPlugin.dll from the recflare/patch repo on a Windows runner.
# The plugin needs ~300 interop assemblies that only exist after Rec Room
# runs under BepInEx on Windows, so this cannot be built on Linux.
#
# Flow:
# 1. Checkout recflare/patch repo
# 2. Install dotnet 8 SDK
# 3. Download + silently install FluxRec-Setup (gets 2023 client + BepInEx)
# 4. Launch game briefly to generate BepInEx/interop assemblies
# 5. Build plugin with GamePath=D:\FluxRec
# 6. Upload RecNetPlugin.dll as artifact

on:
  workflow_dispatch:
    inputs:
      fluxrec_tag:
        description: 'Unused (kept for compatibility). Interop now comes from cached ZIP.'
        required: false
        default: 'recflare-installer-v0.1.25'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout installer repo (contains vendored plugin source)
        uses: actions/checkout@v4
        with:
          repository: riporipoteam-ctrl/rrflux
          ref: main
          path: rrflux

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prep dirs + hosts entry
        shell: pwsh
        run: |
          New-Item -ItemType Directory D:\FluxRec -Force | Out-Null
          try { Add-Content -Path "$env:WINDIR\System32\drivers\etc\hosts" -Value "`n127.0.0.1 ns.rec.net" } catch { Write-Host "hosts edit skipped" }

      # SKIPPED: Download and Install FluxRec (takes 50 min, not needed for plugin build)
      # The plugin only needs the BepInEx/interop assemblies, which we extract
      # from the cached ZIP below. No game installation required.

      - name: Extract cached interop assemblies (20230414)
        shell: pwsh
        run: |
          # Use pre-generated interop assemblies for build 20230414 instead of
          # launching the game (which fails on CI). The interop cache was
          # generated from a working 20230414 client and is version-locked.
          $interopDir = "D:\FluxRec\BepInEx\interop"
          New-Item -ItemType Directory $interopDir -Force | Out-Null
          $zipPath = "rrflux\game\plugin-src\interop-cache\interop-20230414.zip"
          if (-not (Test-Path $zipPath)) { throw "Interop cache not found at $zipPath" }
          Write-Host "Extracting interop cache..."
          Expand-Archive -Path $zipPath -DestinationPath "D:\FluxRec\BepInEx\" -Force
          $count = (Get-ChildItem "$interopDir\*.dll" -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "interop DLLs extracted: $count"
          if ($count -lt 200) { throw "Interop cache incomplete (only $count DLLs)" }
          Write-Host "interop ready from cache"

      - name: Build plugin
        shell: pwsh
        run: |
          cd rrflux\game\plugin-src
          dotnet build -c Release -p:GamePath="D:\FluxRec" 2>&1 | Select-Object -Last 30
          if (-not (Test-Path "bin\Release\net6.0\RecNetPlugin.dll")) { throw "DLL not built" }
          $dll = Get-Item "bin\Release\net6.0\RecNetPlugin.dll"
          Write-Host "built:" $dll.Length "bytes"
          # Install the fresh DLL so the inspector run below uses it
          Copy-Item "bin\Release\net6.0\RecNetPlugin.dll" "D:\FluxRec\BepInEx\plugins\RecNetPlugin.dll" -Force
          Write-Host "installed fresh DLL to plugins"

      # SKIPPED: Run game with fresh plugin (inspector capture)
      # Requires full game installation which we skip for faster builds.
      # The plugin DLL is built and committed without runtime verification.

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: RecNetPlugin
          path: rrflux/game/plugin-src/bin/Release/net6.0/RecNetPlugin.dll

      - name: Commit DLL to installer assets
        shell: pwsh
        run: |
          $dll = "rrflux/game/plugin-src/bin/Release/net6.0/RecNetPlugin.dll"
          $dest = "rrflux/game/installer/assets/RecNetPlugin.dll"
          Copy-Item $dll $dest -Force
          cd rrflux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game/installer/assets/RecNetPlugin.dll
          $msg = "Update RecNetPlugin.dll from CI build $env:GITHUB_RUN_ID"
          git commit -m $msg
          git push origin main
          Write-Host "DLL committed and pushed"

      - name: Upload BepInEx log (inspector output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bepinex-log
          path: D:\FluxRec\BepInEx\LogOutput.log
