name: Verify API avatar Store search

on:
  pull_request:
    paths:
      - '.github/workflows/verify-api-avatar-store.yml'
      - 'server/apps/api/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-api-avatar-store.yml'
      - 'server/apps/api/**'

jobs:
  test:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: server
        run: pnpm install --no-frozen-lockfile

      - name: Run API integration tests
        working-directory: server/apps/api
        run: pnpm run test -- src/test/integration/api.test.ts
