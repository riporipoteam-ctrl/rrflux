name: Build Mobile Launchers

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-launchers.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-launchers.yml"
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Ripo-Team-Launcher-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-source:
    name: iOS simulator build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios/RipoTeamLauncher
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile launcher for iOS Simulator
        run: >-
          xcodebuild
          -project RipoTeamLauncher.xcodeproj
          -scheme RipoTeamLauncher
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          FIREBASE_WEB_API_KEY='${{ secrets.FIREBASE_WEB_API_KEY }}'
          build

  ios-signed:
    name: Signed iOS IPA
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios/RipoTeamLauncher
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_TEAM_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured; signed IPA build skipped."
          fi
      - name: Install XcodeGen
        if: steps.signing.outputs.ready == 'true'
        run: brew install xcodegen
      - name: Import signing certificate and profile
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ripo-team.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/launcher.mobileprovision"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive and export IPA
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          xcodegen generate
          BUNDLE_ID="${IOS_BUNDLE_ID:-com.ripoteam.launcher}"
          xcodebuild \
            -project RipoTeamLauncher.xcodeproj \
            -scheme RipoTeamLauncher \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RipoTeamLauncher.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RipoTeamLauncher.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then echo "Exported IPA missing" >&2; exit 1; fi
          shasum -a 256 "$IPA_PATH" > "$RUNNER_TEMP/ipa/RipoTeamLauncher.ipa.sha256"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Ripo-Team-Launcher-iOS
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/*.sha256

  windows-sideloader:
    name: Windows iPhone Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile/sideloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bundled iPhone device helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pymobiledevice3==11.38.0" "pyinstaller==6.22.3"
          python -m PyInstaller --noconfirm --clean --onefile --name ripo-ios-device-helper --collect-all pymobiledevice3 src-tauri/tools/device_helper.py
          Copy-Item dist/ripo-ios-device-helper.exe src-tauri/tools/ripo-ios-device-helper.exe
          python -m pip download --no-deps --no-binary=:all: "pymobiledevice3==11.38.0" --dest src-tauri/tools/source
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/doronz88/pymobiledevice3/v11.38.0/LICENSE" -OutFile src-tauri/tools/LICENSE.pymobiledevice3.txt
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        env:
          RIPO_LAUNCHER_IPA_URL: ${{ secrets.RIPO_LAUNCHER_IPA_URL }}
          RIPO_LAUNCHER_IPA_SHA256_URL: ${{ secrets.RIPO_LAUNCHER_IPA_SHA256_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Ripo-Team-iPhone-Installer
          path: mobile/sideloader/src-tauri/target/release/bundle/nsis/*.exe


