name: Verify room-loading and subroom-save fixes

on:
  pull_request:
    paths:
      - '.github/workflows/test-room-loading-fix.yml'
      - 'server/packages/domain/**'
      - 'server/apps/match/**'
      - 'server/apps/rooms/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-room-loading-fix.yml'
      - 'server/packages/domain/**'
      - 'server/apps/match/**'
      - 'server/apps/rooms/**'

jobs:
  verify:
    name: Typecheck and test room/save paths
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: server
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck matchmaking worker
        working-directory: server/apps/match
        run: pnpm run check:types

      - name: Test matchmaking and safe SubRoomId repair
        working-directory: server/apps/match
        run: pnpm run test -- src/test/integration/api.test.ts

      - name: Typecheck room worker
        working-directory: server/apps/rooms
        run: pnpm run check:types

      - name: Test room/save and subroom ID regressions
        working-directory: server/apps/rooms
        run: pnpm run test -- src/test/integration/api.test.ts -t "save|SubRoomId"
