# Deploys Firestore security rules on every push to main that touches them.
#
# Rules deploy fine on the free (Spark) plan — only Cloud Functions need
# Blaze, and the edge translator now lives on Cloudflare Workers instead.
# Uses the FIREBASE_SERVICE_ACCOUNT repo secret (service account with
# Editor role on flux-544a6).

name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firebase/firestore.rules"
      - ".github/workflows/deploy-firestore-rules.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          firebase deploy --only firestore:rules \
            --project flux-544a6 --non-interactive
