name: Installer proof (real FluxRec-Setup end-to-end)

# Proves the actual shipped FluxRec-Setup.exe (recflare-installer line):
# silent install with the hidden console + GUI progress window, then launch
# through FluxRecLauncher.exe --play, then screenshot the game. Success =
# the game boots PAST "Failed to initialize Steam Platform" to the account
# picker (the Goldberg Steam bypass working with no Steam client installed).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'recflare-installer release tag to test'
        required: true
        default: 'recflare-installer-v0.1.7'
      upgrade_from:
        description: 'Install this older tag first (simulates upgrading a broken install); empty = fresh install'
        required: false
        default: ''
      hostile:
        description: 'Hostile mode: uninstall VC++ redist + remove Steam before install (tests self-heal on a broken PC)'
        required: false
        default: 'false'
        type: boolean

jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Prep dirs + hosts entry
        shell: pwsh
        run: |
          New-Item -ItemType Directory D:\shots -Force | Out-Null
          try { Add-Content -Path "$env:WINDIR\System32\drivers\etc\hosts" -Value "`n127.0.0.1 ns.rec.net" } catch { Write-Host "hosts edit skipped: $_" }

      - name: Download FluxRec-Setup
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          Invoke-WebRequest -Uri "https://github.com/riporipoteam-ctrl/rrflux/releases/download/$tag/FluxRec-Setup.exe" -OutFile D:\FluxRec-Setup.exe
          Write-Host "downloaded:" (Get-Item D:\FluxRec-Setup.exe).Length "bytes"

      - name: Install older version first (upgrade simulation)
        if: inputs.upgrade_from != ''
        shell: pwsh
        run: |
          $old = "${{ inputs.upgrade_from }}"
          Invoke-WebRequest -Uri "https://github.com/riporipoteam-ctrl/rrflux/releases/download/$old/FluxRec-Setup.exe" -OutFile D:\FluxRec-Setup-old.exe
          Write-Host "downloaded old setup:" (Get-Item D:\FluxRec-Setup-old.exe).Length "bytes"
          $p = Start-Process D:\FluxRec-Setup-old.exe -ArgumentList "--dir","D:\FluxRec" -PassThru
          $deadline = (Get-Date).AddMinutes(55)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            if ($p.HasExited) { break }
            Write-Host "old installer still running..."
          }
          if (-not $p.HasExited) { $p.Kill(); throw "old install timed out" }
          Write-Host "old installer exit code:" $p.ExitCode
          $legacy = Get-Content "D:\FluxRec\steam_appid.txt" -Raw -ErrorAction SilentlyContinue
          Write-Host "legacy steam_appid.txt after old install: [$legacy]"

      - name: Hostile environment (rip out VC++ + Steam)
        if: inputs.hostile
        shell: pwsh
        run: |
          # 1. Uninstall all x64 VC++ redistributables via their quiet uninstall strings
          $paths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $found = 0
          Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object {
            $_.DisplayName -like 'Microsoft Visual C++*Redistributable (x64)*'
          } | ForEach-Object {
            $found++
            Write-Host "uninstalling: $($_.DisplayName)"
            $qs = $_.QuietUninstallString
            if (-not $qs) { $qs = $_.UninstallString }
            try {
              $p = Start-Process cmd.exe -ArgumentList "/c", $qs -PassThru -Wait
              Write-Host "  exit: $($p.ExitCode)"
            } catch { Write-Host "  uninstall error: $_" }
          }
          Write-Host "VC++ x64 entries processed: $found"
          # The uninstallers leave the detection key behind — remove it
          # forcibly, or the installer's VC++ check never actually fires.
          foreach ($k in @('HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64',
                           'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x86',
                           'HKLM:\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x64',
                           'HKLM:\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x86')) {
            if (Test-Path $k) { Remove-Item -Path $k -Recurse -Force; Write-Host "removed key: $k" }
          }
          $key = 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
          if (Test-Path $key) { Write-Host "WARN: VC x64 runtime key STILL present" }
          else { Write-Host "OK: VC x64 runtime key gone (this is what the installer checks)" }

          # 2. Remove the Steam client if present
          $steamPaths = @("${env:ProgramFiles(x86)}\Steam\steam.exe", "$env:ProgramFiles\Steam\steam.exe")
          foreach ($sp in $steamPaths) {
            if (Test-Path $sp) {
              Write-Host "Steam found at $sp - uninstalling..."
              $sk = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like 'Steam*' } | Select-Object -First 1
              if ($sk -and $sk.UninstallString) {
                Start-Process cmd.exe -ArgumentList "/c", ($sk.UninstallString + ' /quiet') -Wait
              }
              if (Test-Path $sp) {
                Remove-Item -Recurse -Force (Split-Path $sp) -ErrorAction SilentlyContinue
                Write-Host "force-removed Steam dir"
              }
            }
          }
          $steamLeft = $false
          foreach ($sp in $steamPaths) { if (Test-Path $sp) { $steamLeft = $true } }
          if ($steamLeft) { Write-Host "WARN: Steam still present" }
          else { Write-Host "OK: no Steam client on this PC" }

      - name: Run installer (hidden console + GUI progress window)
        shell: pwsh
        run: |
          $p = Start-Process D:\FluxRec-Setup.exe -ArgumentList "--dir","D:\FluxRec" -PassThru
          $deadline = (Get-Date).AddMinutes(55)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            if ($p.HasExited) { break }
            Write-Host "installing... (installer still running)"
          }
          if (-not $p.HasExited) { Write-Host "INSTALL TIMEOUT — killing"; $p.Kill() }
          else { Write-Host "installer exit code:" $p.ExitCode }

      - name: Verify install layout
        shell: pwsh
        run: |
          $checks = @(
            "D:\FluxRec\RecRoom.exe",
            "D:\FluxRec\FluxRecLauncher.exe",
            "D:\FluxRec\BepInEx\plugins\RecNetPlugin.dll",
            "D:\FluxRec\BepInEx\config\net.rec.plugin.cfg",
            "D:\FluxRec\RecRoom_Data\Plugins\x86_64\steam_api64.dll",
            "D:\FluxRec\RecRoom_Data\Plugins\x86_64\steam_settings\steam_appid.txt",
            "D:\FluxRec\RecRoom_Data\Plugins\x86_64\steam_settings\steam_interfaces.txt"
          )
          foreach ($c in $checks) {
            if (Test-Path $c) { Write-Host "OK  $c" } else { Write-Host "MISSING  $c" }
          }
          $appid = Get-Content "D:\FluxRec\RecRoom_Data\Plugins\x86_64\steam_settings\steam_appid.txt" -Raw -ErrorAction SilentlyContinue
          Write-Host "steam_appid.txt content: [$appid]"
          if (Test-Path "D:\FluxRec\steam_appid.txt") { Write-Host "WARN: legacy root steam_appid.txt still present" }
          else { Write-Host "OK  no legacy root steam_appid.txt" }

      - name: Launch via FluxRecLauncher --play
        shell: pwsh
        run: |
          Start-Process D:\FluxRec\FluxRecLauncher.exe -ArgumentList "--play","--dir","D:\FluxRec"
          Write-Host "launcher started, waiting for RecRoom window..."
          $booted = $false
          $deadline = (Get-Date).AddMinutes(12)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $p = Get-Process RecRoom -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p -and $p.MainWindowHandle -ne 0) { Write-Host "game window up"; $booted = $true; break }
            if (-not (Get-Process RecRoom -ErrorAction SilentlyContinue)) { Write-Host "no RecRoom process yet..." }
          }
          if (-not $booted) { Write-Host "::error::PROOF FAILED — RecRoom window never appeared (launcher may be stuck)"; exit 1 }
          Write-Host "waiting 90s for boot past Steam init..."
          Start-Sleep -Seconds 90

      - name: Screenshot boot state
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          function Shot($name) {
            $bmp = New-Object System.Drawing.Bitmap(1280, 720)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen([System.Drawing.Point]::new(0,0), [System.Drawing.Point]::Empty, [System.Drawing.Size]::new(1280,720))
            $bmp.Save("D:\shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); Write-Host "saved $name.png"
          }
          Shot boot
          $p = Get-Process RecRoom -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($p) { Write-Host "RecRoom still running (id $($p.Id))" } else { Write-Host "::error::PROOF FAILED — RecRoom not running at screenshot time"; exit 1 }
          Start-Sleep -Seconds 45
          Shot boot2

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-proof-shots
          path: D:\shots\*.png
