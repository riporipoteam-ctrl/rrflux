name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Comma-separated worker dirs to deploy (default: all changed)'
        required: false
        default: 'auth,accounts,rooms,econ,api,clubs,img'

jobs:
  deploy:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RECFLARE_DOMAIN: ${{ secrets.RECFLARE_DOMAIN }}
      RECFLARE_WORKERS_DEV: ${{ secrets.RECFLARE_WORKERS_DEV }}
      RECFLARE_D1: ${{ secrets.RECFLARE_D1 }}
      RECFLARE_KV: ${{ secrets.RECFLARE_KV }}
      RECFLARE_SECRETS_STORE: ${{ secrets.RECFLARE_SECRETS_STORE }}
      RECFLARE_STARTING_TOKENS: ${{ secrets.RECFLARE_STARTING_TOKENS }}
      RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID }}
      RECFLARE_MAX_ACCOUNTS_PER_IP: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_IP }}

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy workers in order
        run: |
          set -euo pipefail
          IFS=',' read -ra WORKERS <<< "${{ inputs.workers }}"
          for worker in "${WORKERS[@]}"; do
            worker=$(echo "$worker" | xargs)
            echo "=== Deploying $worker ==="
            (cd "apps/$worker" && pnpm run deploy)
            echo "=== $worker deployed ==="
          done
