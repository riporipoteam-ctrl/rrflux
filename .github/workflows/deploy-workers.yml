name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Comma-separated worker dirs to deploy (default: auth,accounts,rooms,econ,api,lists,discovery,clubs,cdn,img,match)'
        required: false
        default: 'auth,accounts,rooms,econ,api,lists,discovery,clubs,cdn,img,match'
      target:
        description: "Deploy target: 'workers-dev' deploys to <name>.workers.dev; 'custom-domain' deploys onto <subdomain>.recflare.net (the client-facing hosts)"
        required: false
        default: 'workers-dev'
  # A merged backend fix is not finished while the live Worker is still running
  # yesterday's bundle. Deploy the same known worker set after relevant main changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-workers.yml'
      - 'server/apps/api/**'
      - 'server/apps/auth/**'
      - 'server/apps/cdn/**'
      - 'server/apps/econ/**'
      - 'server/apps/img/**'
      - 'server/apps/rooms/**'
      - 'server/apps/lists/**'
      - 'server/apps/match/**'
      - 'server/apps/discovery/**'
      - 'server/packages/domain/**'
      - 'server/packages/jwt/**'
      - 'server/packages/tools/**'

jobs:
  deploy:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RECFLARE_DOMAIN: ${{ secrets.RECFLARE_DOMAIN }}
      # Pushes use the same workers.dev target as the existing manual default.
      # The endpoint account has no recflare.net zone, so don't silently switch to custom domains.
      RECFLARE_WORKERS_DEV: ${{ (github.event_name == 'push' || inputs.target == 'workers-dev') && secrets.RECFLARE_WORKERS_DEV || '' }}
      RECFLARE_D1: ${{ secrets.RECFLARE_D1 }}
      RECFLARE_KV: ${{ secrets.RECFLARE_KV }}
      RECFLARE_SECRETS_STORE: ${{ secrets.RECFLARE_SECRETS_STORE }}
      RECFLARE_STARTING_TOKENS: ${{ secrets.RECFLARE_STARTING_TOKENS }}
      RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID }}
      RECFLARE_MAX_ACCOUNTS_PER_IP: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_IP }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Select workers changed by this event
        id: selected-workers
        env:
          REQUESTED_WORKERS: ${{ inputs.workers }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            workers="$(printf '%s\n' "$changed_files" | sed -nE 's#^server/apps/(accounts|api|auth|cdn|clubs|discovery|econ|img|lists|match|rooms)/.*#\1#p' | sort -u | paste -sd, -)"
            if printf '%s\n' "$changed_files" | grep -Eq '^server/packages/'; then
              workers='auth,accounts,rooms,econ,api,lists,discovery,clubs,img,match'
            fi
            # The 2025 client uses a separate workers.dev name for Econ.
            # Deploy it when workflow routing changes so this alias stays current.
            if printf '%s\n' "$changed_files" | grep -Fxq '.github/workflows/deploy-workers.yml'; then
              workers="$(printf '%s\n' "$workers" econ match | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)"
            fi
          else
            workers="$REQUESTED_WORKERS"
            if [ -z "$workers" ]; then
              workers='api,auth,cdn,econ,img,lists,discovery,rooms,match'
            fi
          fi
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "Selected workers: ${workers:-none}"

      - name: Load first-party custom avatar items
        if: contains(steps.selected-workers.outputs.workers, 'api')
        run: bun runx admin cai-load --remote

      - name: Deploy workers in order
        if: steps.selected-workers.outputs.workers != ''
        run: |
          set -euo pipefail
          WORKERS_INPUT="${{ steps.selected-workers.outputs.workers }}"
          IFS=',' read -ra WORKERS <<< "$WORKERS_INPUT"
          for worker in "${WORKERS[@]}"; do
            worker=$(echo "$worker" | xargs)
            echo "=== Deploying $worker ==="
            (cd "apps/$worker" && pnpm run deploy)
            echo "=== $worker deployed ==="
            if [ "$worker" = "econ" ]; then
              echo "=== Deploying 2025 client Econ alias ==="
              (cd apps/econ && pnpm run deploy --name fluxrec-econ)
              echo "=== fluxrec-econ deployed ==="
            fi
          done

