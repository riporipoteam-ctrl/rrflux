name: Refresh live item catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/apps/econ/src/catalog-load.ts'
      - 'server/apps/econ/static/db/avatar-items.json'
      - 'server/apps/econ/static/db/skins.json'
      - 'server/packages/tools/src/cmd/catalog.cmd.ts'
      - '.github/workflows/refresh-live-item-catalog.yml'

jobs:
  load:
    name: Merge captured items into live D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RECFLARE_D1: ${{ secrets.RECFLARE_D1 }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: server
        run: pnpm install --no-frozen-lockfile

      - name: Validate captures before touching production
        working-directory: server
        run: bash packages/tools/bin/runx catalog check

      - name: Load catalog into production D1
        working-directory: server
        run: bash packages/tools/bin/runx catalog load --remote
