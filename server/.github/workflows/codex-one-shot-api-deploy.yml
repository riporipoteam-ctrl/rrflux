name: One-time 2025 API repair deploy

on:
  push:
    branches:
      - codex/publish-store-and-room-fixes
    paths:
      - .github/workflows/codex-one-shot-api-deploy.yml

jobs:
  deploy:
    name: Deploy 2025 API repair to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RECFLARE_DOMAIN: ${{ secrets.RECFLARE_DOMAIN }}
      RECFLARE_WORKERS_DEV: ${{ secrets.RECFLARE_WORKERS_DEV }}
      RECFLARE_D1: ${{ secrets.RECFLARE_D1 }}
      RECFLARE_KV: ${{ secrets.RECFLARE_KV }}
      RECFLARE_SECRETS_STORE: ${{ secrets.RECFLARE_SECRETS_STORE }}
      RECFLARE_STARTING_TOKENS: ${{ secrets.RECFLARE_STARTING_TOKENS }}
      RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_PLATFORM_ID }}
      RECFLARE_MAX_ACCOUNTS_PER_IP: ${{ secrets.RECFLARE_MAX_ACCOUNTS_PER_IP }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Deploy active 2025 API Worker
        run: cd apps/api && pnpm run deploy
