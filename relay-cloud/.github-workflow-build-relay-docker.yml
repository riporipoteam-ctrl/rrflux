name: Build relay Docker (Hostless smoke)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - relay-cloud/**
      - tachyon-server/src/**
  pull_request:
    paths:
      - Dockerfile
      - relay-cloud/**
      - tachyon-server/src/**

jobs:
  docker-build:
    name: docker build (same as Hostless)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fluxrec-relay:ci
          load: true
      - name: Smoke (health + binaries)
        run: |
          docker run --rm fluxrec-relay:ci sh -c 'command -v playitd && test -x /relay/TachyonServer'
          docker run --rm -d --name fluxrec-smoke -e PORT=8000 -p 18080:8000 \
            --entrypoint python3 fluxrec-relay:ci /relay/health_server.py
          sleep 2
          curl -fsS http://127.0.0.1:18080/health
          docker rm -f fluxrec-smoke