# Copy this file to .github/workflows/publish-relay-ghcr.yml (needs workflow scope push once).
name: Publish relay image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - relay-cloud/**
      - tachyon-server/src/**

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          dotnet publish -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            tachyon-server/src/TachyonServer/TachyonServer.csproj \
            -o relay-cloud/publish
          cp relay-cloud/publish/TachyonServer relay-cloud/TachyonServer
          chmod +x relay-cloud/TachyonServer
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay-cloud
          push: true
          tags: ghcr.io/riporipoteam-ctrl/fluxrec-relay:latest