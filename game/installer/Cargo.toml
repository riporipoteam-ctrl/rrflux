[package]
name = "fluxrec-installer"
version = "0.1.24"
edition = "2021"
description = "Zero-touch Flux Rec setup: fetches the 2023 Rec Room client, BepInEx and the RecNet redirect plugin, writes config, no Steam client needed."

[build-dependencies]
# Embeds the Flux Rec icon + version metadata into FluxRec-Setup.exe on
# Windows CI. build.rs no-ops on other platforms so Linux checks stay clean.
winres = "0.1"

[[bin]]
name = "FluxRec-Setup"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
futures-util = "0.3"
zip = "2"
md5 = "0.7"
flate2 = "1"
serde_json = "1"
sevenz-rust = "0.6"

# Win32 GUI (installer window) — Windows-only; other targets skip it so
# `cargo check` on Linux stays light.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Threading",
] }
